[package]
name = "wiki-tools"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
debug = 0
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false

[dependencies]
csv = { version = "1.4.0", default-features = false }
ddsfile = "0.6.0"
futures = { version = "0.3.34", features = ["alloc"], default-features = false }
image = "0.25.10"
reqwest = { version = "0.13.5", features = ["blocking", "json", "multipart", "cookies", "query", "form", "stream"] }
serde = { version="1.0.229", features = ["derive"], default-features = false }
serde_json = "1.0.154"
texture2ddecoder = "0.1.2"
thiserror = { version = "2.0.20", features = ["std"], default-features = false }
tokio = { version = "1.53.1", features = ["fs", "macros", "process", "rt-multi-thread", "sync"], default-features = false }
